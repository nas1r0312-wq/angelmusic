<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; media-src https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AngelMusic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg" class="bg"></div>

  <aside class="rail glass">
    <img class="logo" src="logo.png" alt="AngelMusic">
    <button data-tab="search" class="on"><span class="ico" data-icon="search"></span><span>Ara</span></button>
    <button data-tab="queue"><span class="ico" data-icon="queue"></span><span>Sıra</span></button>
    <button data-tab="liked"><span class="ico" data-icon="heart"></span><span>Beğeni</span></button>
    <button data-tab="playlists"><span class="ico" data-icon="library"></span><span>Listeler</span></button>
  </aside>

  <main>
    <header>
      <form id="searchForm" class="search glass" role="search">
        <span class="ico" data-icon="search"></span>
        <input id="q" type="search" placeholder="Şarkı, sanatçı veya albüm ara" autocomplete="off" spellcheck="false">
      </form>
    </header>
    <section id="view" class="view" aria-live="polite"></section>
  </main>

  <div id="mini" class="mini-player glass" role="button" tabindex="0" title="Oynatıcıyı aç">
    <img id="m-thumb" alt="">
    <div class="m-meta"><div id="m-title">Çalan yok</div><div id="m-artist"></div></div>
    <div class="m-controls">
      <button id="m-prev" data-icon="prev" title="Önceki"></button>
      <button id="m-toggle" class="fab" data-icon="play" title="Oynat / duraklat"></button>
      <button id="m-next" data-icon="next" title="Sonraki"></button>
    </div>
    <div class="m-bar"><div id="m-fill"></div></div>
  </div>

  <div id="full" class="full hidden" aria-hidden="true">
    <button id="closeFull" class="close" data-icon="chevron" title="Kapat (Esc)"></button>
    <div class="full-grid">
      <div class="art-col">
        <img id="f-art" alt="">
        <div class="f-title"><h1 id="f-title">Çalan yok</h1><p id="f-artist"></p></div>
        <div class="seek-row">
          <span id="cur">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Konum">
          <span id="dur">0:00</span>
        </div>
        <div class="f-controls">
          <button id="shuffle" data-icon="shuffle" title="Karışık çal"></button>
          <button id="f-prev" data-icon="prev" title="Önceki"></button>
          <button id="f-toggle" class="fab big" data-icon="play" title="Oynat / duraklat (Boşluk)"></button>
          <button id="f-next" data-icon="next" title="Sonraki"></button>
          <button id="repeat" data-icon="repeat" title="Tekrarla"></button>
        </div>
        <div class="f-actions">
          <button id="likeBtn" class="pill" type="button"></button>
          <button id="addList" class="pill" type="button"><span class="ico" data-icon="plus"></span>Listeye ekle</button>
          <button id="dlBtn" class="pill" type="button"><span class="ico" data-icon="download"></span>İndir</button>
          <label class="vol"><span class="ico" data-icon="volume"></span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Ses"></label>
        </div>
      </div>
      <div class="lyrics-col">
        <div id="lyricsBody" class="lyrics-body"></div>
      </div>
    </div>
  </div>

  <div id="menu" class="menu glass hidden" role="menu"></div>
  <audio id="audio" preload="auto"></audio>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
